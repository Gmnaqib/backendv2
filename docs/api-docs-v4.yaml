      summary: Sinkronisasi User dari API Eksternal
      description: |
        Menghapus seluruh data users dan unit_types, lalu mengambil ulang data struktural
        pegawai dari API UNIKOM. **Hanya Admin.**
      operationId: syncUsers
      security:
        - bearerAuth: []
      responses:
        200:
          description: Sinkronisasi berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 500
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'

  # ==================== ADMIN - DROPDOWN ====================
  /api/dropdown:
    get:
      tags:
        - User
      summary: Dropdown Unit Organisasi
      description: Ambil struktur unit/bagian organisasi berbentuk tree untuk dropdown. **Hanya Admin.**
      operationId: dropdown
      security:
        - bearerAuth: []
      responses:
        200:
          description: Struktur unit berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        unit_id:
                          type: integer
                        children:
                          type: array
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'

  # ==================== ADMIN - REKAP VENDOR ====================
  /api/rekap-vendor:
    get:
      tags:
        - Vendor
      summary: Rekap Pengajuan per Vendor
      description: |
        Rekap barang yang disetujui per vendor. Filter opsional dengan `id_aktivasi`.
        Jika tidak dikirim, menggunakan periode aktif. **Hanya Admin.**
      operationId: rekapVendor
      security:
        - bearerAuth: []
      parameters:
        - name: id_aktivasi
          in: query
          description: ID aktivasi pengajuan (opsional)
          schema:
            type: integer
      responses:
        200:
          description: Rekap vendor berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vendor'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'

  # ==================== ADMIN - DAFTAR PENGAJUAN ====================
  /api/admin/daftar-pengajuan:
    get:
      tags:
        - Pengajuan
      summary: List Pengajuan untuk Admin
      description: |
        List pengajuan dengan filter untuk admin. **Hanya Admin.**
        Filter tersedia: id_aktivasi, jabatan_id, bagian_id (unit), status, tipe.
      operationId: adminListPengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: id_aktivasi
          in: query
          description: Filter berdasarkan ID aktivasi
          schema:
            type: integer
        - name: jabatan_id
          in: query
          description: Filter berdasarkan jabatan
          schema:
            type: integer
        - name: bagian_id
          in: query
          description: Filter berdasarkan unit/bagian
          schema:
            type: integer
        - name: status
          in: query
          description: Filter berdasarkan status barang pengajuan
          schema:
            type: integer
            example: 1
        - name: tipe
          in: query
          description: Filter berdasarkan tipe pengajuan (tahunan, ujian, kelas)
          schema:
            type: string
      responses:
        200:
          description: List pengajuan admin berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DaftarPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'

  # ==================== ADMIN - CETAK BERKAS ====================
  /api/admin/cetak-berkas:
    get:
      tags:
        - Pengajuan
      summary: Cetak Berkas Pengajuan
      description: |
        Ambil rekapan barang pengajuan beserta total harga untuk berkas/cetak. **Hanya Admin.**
      operationId: cetakBerkas
      security:
        - bearerAuth: []
      parameters:
        - name: tahun
          in: query
          required: true
          description: Tahun pengajuan
          schema:
            type: integer
            example: 2026
        - name: id_aktivasi
          in: query
          required: true
          description: ID aktivasi pengajuan
          schema:
            type: integer
        - name: tipe
          in: query
          description: Filter tipe aktivasi (rutin/nonrutin)
          schema:
            type: string
        - name: kategori_atk
          in: query
          description: Filter kategori ATK (tahunan/kelas/ujian)
          schema:
            type: string
      responses:
        200:
          description: Data berkas berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tahun:
                        type: integer
                      id_aktivasi:
                        type: integer
                      tipe:
                        type: string
                      kategori_atk:
                        type: string
                      total_harga:
                        type: number
                      barang_pengajuan:
                        type: array
                        items:
                          type: object
                          properties:
                            nama_barang:
                              type: string
                            unit:
                              type: string
                            jumlah:
                              type: integer
                            harga:
                              type: number
                            subtotal:
                              type: number
                            vendor:
                              type: string
                      barang_pengajuan_lainnya:
                        type: array
                        items:
                          type: object
                          properties:
                            nama_barang:
                              type: string
                            kategori:
                              type: string
                            satuan:
                              type: string
                            jumlah:
                              type: integer
                            harga:
                              type: number
                            subtotal:
                              type: number
                            vendor:
                              type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'

  # ==================== PENGUMUMAN ====================
  /api/pengumuman:
    get:
      tags:
        - Pengumuman
      summary: List Pengumuman
      description: Ambil daftar semua pengumuman.
      operationId: listPengumuman
      security:
        - bearerAuth: []
      responses:
        200:
          description: List pengumuman berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pengumuman'
        401:
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Pengumuman
      summary: Buat Pengumuman Baru
      description: Buat pengumuman baru dengan judul, deskripsi, dan gambar. **Hanya Admin.**
      operationId: createPengumuman
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - judul
              properties:
                judul:
                  type: string
                  example: "Pengumuman Libur Nasional"
                deskripsi:
                  type: string
                  example: "Libur tanggal 17 Agustus 2026"
                gambar:
                  type: string
                  format: binary
                  description: File gambar (jpg, png, jpeg - max 2MB)
      responses:
        201:
          description: Pengumuman berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Pengumuman'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

  /api/pengumuman/{id}:
    get:
      tags:
        - Pengumuman
      summary: Detail Pengumuman
      description: Ambil detail pengumuman beserta gambarnya.
      operationId: getPengumuman
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detail pengumuman berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Pengumuman'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Pengumuman
      summary: Update Pengumuman
      description: |
        Update pengumuman. Gunakan PUT + multipart/form-data jika update dengan gambar baru.
        **Hanya Admin.**
      operationId: updatePengumuman
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                judul:
                  type: string
                  example: "Update Pengumuman"
                deskripsi:
                  type: string
                  example: "Isi pengumuman terbaru"
                gambar:
                  type: string
                  format: binary
      responses:
        200:
          description: Pengumuman berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Pengumuman'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Pengumuman
      summary: Hapus Pengumuman
      description: Hapus pengumuman. **Hanya Admin.**
      operationId: deletePengumuman
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Pengumuman berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

  # ==================== TEST ====================
  /api/swagger-test:
    get:
      tags:
        - Test
      summary: Test Swagger
      description: Endpoint untuk testing dokumentasi Swagger.
      operationId: testSwagger
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Swagger is working"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Gunakan Bearer Token yang didapat dari endpoint login.
        
        Format: `Authorization: Bearer {token}`
        
        Contoh:
        ```
        Authorization: Bearer 1|abcdef123456...
        ```

  schemas:
    # ==================== ERROR RESPONSES ====================
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"
        errors:
          type: object
          example: { "field": ["error message"] }

    # ==================== AUTH SCHEMAS ====================
    UserDetail:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "gilang"
        email:
          type: string
          format: email
          example: "gilang@mail.com"
        nip:
          type: string
          example: "12345678"
        jenis_kelamin:
          type: string
          enum: [Pria, Wanita]
        role:
          type: string
          enum: [user, admin]
          example: "user"
        foto:
          type: string
          nullable: true
        jabatan:
          $ref: '#/components/schemas/Jabatan'
        unit:
          $ref: '#/components/schemas/UnitType'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== AKTIVASI PENGAJUAN SCHEMAS ====================
    AktivasiPengajuan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_pengajuan:
          type: integer
          example: 1
        aktif_mulai:
          type: string
          format: date
          example: "2026-01-01"
        aktif_selesai:
          type: string
          format: date
          example: "2026-01-31"
        tipe:
          type: string
          enum: [tahunan, ujian, kelas]
          example: "tahunan"
        tahun_akademik:
          type: string
          example: "2025/2026"
        pengajuan:
          type: object
          properties:
            id:
              type: integer
            tipe:
              type: string
              enum: [tahunan, ujian, kelas]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== BARANG SCHEMAS ====================
    Barang:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: "Kertas A4 80gsm"
        vendor_id:
          type: integer
          example: 1
        vendor:
          $ref: '#/components/schemas/Vendor'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== PENGAJUAN SCHEMAS ====================
    DaftarPengajuan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
        id_aktivasi:
          type: integer
        catatan:
          type: string
          nullable: true
        date:
          type: string
          format: date
        surat_pengajuan:
          type: string
          nullable: true
          description: URL file surat pengajuan
        user:
          $ref: '#/components/schemas/UserDetail'
        aktivasi:
          $ref: '#/components/schemas/AktivasiPengajuan'
        barang:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              id_barang:
                type: integer
              jumlah:
                type: integer
              jumlah_disetujui:
                type: integer
              status:
                type: boolean
                example: false
              barang:
                $ref: '#/components/schemas/Barang'
        barangLainnya:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              nama:
                type: string
              jumlah:
                type: integer
              kategori:
                type: string
                enum: [habis_pakai, tidak_habis_pakai]
              satuan:
                type: string
              alasan:
                type: string
              bukti_foto:
                type: string
                nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== VENDOR SCHEMAS ====================
    Vendor:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: "PT Sumber Makmur"
        kontak:
          type: string
          example: "081234567890"
        alamat:
          type: string
          example: "Jln. Ahmad Yani No. 123, Bandung"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== JABATAN SCHEMAS ====================
    Jabatan:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: "Staff IT"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== UNIT TYPE SCHEMAS ====================
    UnitType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nama:
          type: string
          example: "Fakultas"
        parent_id:
          type: integer
          nullable: true
        children:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== PENGUMUMAN SCHEMAS ====================
    Pengumuman:
      type: object
      properties:
        id:
          type: integer
          example: 1
        judul:
          type: string
          example: "Pengumuman Libur Nasional"
        deskripsi:
          type: string
          example: "Libur tanggal 17 Agustus 2026"
        gambar:
          type: string
          nullable: true
          description: URL gambar pengumuman
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Unauthorized - Token tidak valid atau expired
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "unauthenticated"

    Forbidden:
      description: Forbidden - Akses ditolak (bukan admin atau role tidak sesuai)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "akses ditolak"

    NotFound:
      description: Not Found - Resource tidak ditemukan
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Data tidak ditemukan"

    UnprocessableEntity:
      description: Validation Error - Validasi gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Validation failed"
              errors:
                type: object
                example:
                  email: ["Email sudah terdaftar"]
                  password: ["Password minimal 8 karakter"]