openapi: 3.0.0
info:
  title: LOGISTIK UNIKOM API
  version: 4.0.0
  description: |
    API untuk sistem manajemen logistik dan pengajuan barang di Universitas Komputer Indonesia.
    
    ### Fitur Utama:
    - **Autentikasi** dengan Sanctum Token
    - **Manajemen Pengajuan** (tahunan, ujian, kelas)
    - **Aktivasi Periode Pengajuan**
    - **Manajemen Barang** dan Vendor
    - **Laporan & Statistik**
    
    ### Tipe User:
    - **Admin** - Kelola semua data sistem
    - **User** - Buat pengajuan barang
  contact:
    name: Support IT
    email: support@unikom.ac.id
  license:
    name: MIT

servers:
  - url: http://perlengkapan.codelabspace.or.id/
    description: Production Server
  - url: http://localhost:8000/
    description: Local Development

tags:
  - name: Auth
    description: Autentikasi & Profil User
  - name: Aktivasi Pengajuan
    description: Manajemen periode pengajuan dan aktivasi
  - name: Barang
    description: Master data barang
  - name: Pengajuan
    description: CRUD pengajuan barang
  - name: Jabatan
    description: Master data jabatan (Admin Only)
  - name: Unit Type
    description: Master data unit/bagian organisasi (Admin Only)
  - name: User
    description: Manajemen user (Admin Only)
  - name: Vendor
    description: Master data vendor (Admin Only)
  - name: Pengumuman
    description: Kelola pengumuman sistem
  - name: Test
    description: Endpoint testing

paths:
  # ==================== AUTH ====================
  /api/login:
    post:
      tags:
        - Auth
      summary: Login User
      description: Login menggunakan username dan password. Mengembalikan Bearer Token untuk autentikasi.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                  description: Username terdaftar di sistem
                password:
                  type: string
                  format: password
                  example: password123
                  description: Password akun
      responses:
        200:
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "1|abcdef123456..."
                        description: Bearer Token untuk request berikutnya
                      user:
                        $ref: '#/components/schemas/UserDetail'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

  /api/me:
    get:
      tags:
        - Auth
      summary: Get Profile User Login
      description: Ambil data profil user yang sedang login beserta jabatan dan unit.
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profil berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UserDetail'
        401:
          $ref: '#/components/responses/Unauthorized'

  /api/logout:
    post:
      tags:
        - Auth
      summary: Logout User
      description: Logout dan hapus token akses yang sedang digunakan.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        200:
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "logout berhasil"
        401:
          $ref: '#/components/responses/Unauthorized'

  /api/profile:
    post:
      tags:
        - Auth
      summary: Update Profil User Login
      description: Update username dan foto profil user yang sedang login.
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: gilang_baru
                  description: Username baru (opsional)
                foto:
                  type: string
                  format: binary
                  description: File foto profil (jpg, png, jpeg max 2MB)
      responses:
        200:
          description: Profil berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/UserDetail'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

  # ==================== AKTIVASI PENGAJUAN ====================
  /api/aktivasi-pengajuan:
    get:
      tags:
        - Aktivasi Pengajuan
      summary: List Semua Aktivasi Pengajuan
      description: Ambil daftar semua periode aktivasi pengajuan. Bisa difilter berdasarkan tipe pengajuan.
      operationId: listAktivasiPengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: tipe
          in: query
          description: Filter berdasarkan tipe pengajuan
          schema:
            type: string
            enum: [tahunan, ujian, kelas]
            example: tahunan
      responses:
        200:
          description: List aktivasi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AktivasiPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Aktivasi Pengajuan
      summary: Buat Aktivasi Pengajuan Baru
      description: Buat periode aktivasi pengajuan baru. **Hanya Admin.**
      operationId: createAktivasiPengajuan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_pengajuan
                - aktif_mulai
                - aktif_selesai
                - tipe
                - tahun_akademik
              properties:
                id_pengajuan:
                  type: integer
                  example: 1
                  description: ID tipe pengajuan
                aktif_mulai:
                  type: string
                  format: date
                  example: "2026-01-01"
                  description: Tanggal mulai periode aktif
                aktif_selesai:
                  type: string
                  format: date
                  example: "2026-01-31"
                  description: Tanggal selesai periode aktif
                tipe:
                  type: string
                  enum: [rutin, nonrutin]
                  example: rutin
                tahun_akademik:
                  type: string
                  example: "2025/2026"
      responses:
        201:
          description: Aktivasi berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AktivasiPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

  /api/aktivasi-pengajuan/{id}:
    get:
      tags:
        - Aktivasi Pengajuan
      summary: Detail Aktivasi Pengajuan
      description: Ambil detail aktivasi pengajuan berdasarkan ID.
      operationId: getAktivasiPengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        200:
          description: Detail aktivasi berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AktivasiPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Aktivasi Pengajuan
      summary: Update Aktivasi Pengajuan
      description: Update data aktivasi pengajuan. **Hanya Admin.**
      operationId: updateAktivasiPengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_pengajuan:
                  type: integer
                aktif_mulai:
                  type: string
                  format: date
                aktif_selesai:
                  type: string
                  format: date
                tipe:
                  type: string
                  enum: [rutin, nonrutin]
                tahun_akademik:
                  type: string
      responses:
        200:
          description: Aktivasi berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AktivasiPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Aktivasi Pengajuan
      summary: Hapus Aktivasi Pengajuan
      description: Hapus periode aktivasi pengajuan. **Hanya Admin.**
      operationId: deleteAktivasiPengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Aktivasi berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Aktivasi berhasil dihapus"
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

  /api/periode-aktif:
    get:
      tags:
        - Aktivasi Pengajuan
      summary: Ambil Periode Aktif Saat Ini
      description: |
        Ambil periode pengajuan yang sedang aktif (dalam range tanggal hari ini).
        Bisa difilter berdasarkan tipe pengajuan.
      operationId: getCurrentActivePeriod
      security:
        - bearerAuth: []
      parameters:
        - name: tipe
          in: query
          description: Filter berdasarkan tipe pengajuan
          schema:
            type: string
            enum: [tahunan, ujian, kelas]
            example: tahunan
      responses:
        200:
          description: Periode aktif ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AktivasiPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          description: Tidak ada periode yang sedang aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/aktivasi-pengajuan/{id}/activate:
    patch:
      tags:
        - Aktivasi Pengajuan
      summary: Aktifkan Periode Pengajuan
      description: Aktifkan periode pengajuan agar user bisa mulai mengajukan. **Hanya Admin.**
      operationId: activatePeriod
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Periode berhasil diaktifkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Periode aktivasi siap digunakan"
                  data:
                    $ref: '#/components/schemas/AktivasiPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

  /api/aktivasi-pengajuan/{id}/summary:
    get:
      tags:
        - Aktivasi Pengajuan
      summary: Ringkasan & Statistik Pengajuan
      description: |
        Ambil ringkasan pengajuan untuk satu periode aktivasi termasuk:
        - Statistik jumlah pengajuan
        - Detail pengajuan per user/unit
        - Status barang yang diajukan
        
        **Hanya Admin.**
      operationId: getAktivasiSummary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Ringkasan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      aktivasi:
                        $ref: '#/components/schemas/AktivasiPengajuan'
                      statistik:
                        type: object
                        properties:
                          jumlah_pengajuan_masuk:
                            type: integer
                            example: 15
                          total_pengaju:
                            type: integer
                            example: 20
                      detail_pengajuan:
                        type: array
                        items:
                          type: object
                          properties:
                            nama:
                              type: string
                            unit:
                              type: string
                            jabatan:
                              type: string
                            status:
                              type: string
                              enum: [Sudah Pengajuan, Belum Pengajuan]
                            barang:
                              type: array
                              items:
                                type: object
                                properties:
                                  nama_barang:
                                    type: string
                                  qty:
                                    type: integer
                                  jumlah_disetujui:
                                    type: integer
                                  status:
                                    type: string
                                  vendor:
                                    type: string
                            barang_lainnya:
                              type: array
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

  # ==================== BARANG ====================
  /api/barang:
    get:
      tags:
        - Barang
      summary: List Semua Barang
      description: Ambil daftar semua master barang beserta vendor-nya.
      operationId: listBarang
      security:
        - bearerAuth: []
      responses:
        200:
          description: List barang berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Barang'
        401:
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Barang
      summary: Buat Barang Baru
      description: Buat master data barang baru. **Hanya Admin.**
      operationId: createBarang
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nama
                - vendor_id
              properties:
                nama:
                  type: string
                  example: "Kertas A4 80gsm"
                  description: Nama barang
                vendor_id:
                  type: integer
                  example: 1
                  description: ID vendor supplier
      responses:
        201:
          description: Barang berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Barang'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

  /api/barang/{id}:
    get:
      tags:
        - Barang
      summary: Detail Barang
      description: Ambil detail barang beserta informasi vendor-nya.
      operationId: getBarang
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detail barang berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Barang'
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Barang
      summary: Update Barang
      description: Update data barang. **Hanya Admin.**
      operationId: updateBarang
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                vendor_id:
                  type: integer
      responses:
        200:
          description: Barang berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Barang'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Barang
      summary: Hapus Barang
      description: Hapus master data barang. **Hanya Admin.**
      operationId: deleteBarang
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Barang berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "deleted"
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

  # ==================== PENGAJUAN ====================
  /api/daftar-pengajuan:
    get:
      tags:
        - Pengajuan
      summary: List Semua Pengajuan
      description: |
        Ambil daftar semua pengajuan beserta barang dan barang lainnya.
        Menampilkan seluruh pengajuan yang ada.
      operationId: listPengajuan
      security:
        - bearerAuth: []
      responses:
        200:
          description: List pengajuan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DaftarPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'

  /api/daftar-pengajuan/full:
    post:
      tags:
        - Pengajuan
      summary: Buat Pengajuan Baru (Full)
      description: |
        Buat pengajuan barang baru dengan detail lengkap:
        - Daftar barang dari master
        - Barang lainnya (custom/manual)
        - File surat pengajuan
        - Bukti foto untuk barang manual
        
        **Format pengajuan:**
        - Tipe: tahunan, ujian, atau kelas
        - Barang bisa dikirim sebagai JSON string atau array
        - Setiap barang manual bisa punya bukti foto (bukti_foto_0, bukti_foto_1, etc)
      operationId: createPengajuanFull
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - tipe
              properties:
                tipe:
                  type: string
                  enum: [tahunan, ujian, kelas]
                  example: tahunan
                  description: Tipe pengajuan
                date:
                  type: string
                  format: date
                  example: "2026-07-13"
                  description: Tanggal pengajuan (opsional)
                surat_pengajuan:
                  type: string
                  format: binary
                  description: File surat pengajuan (pdf, doc, docx - max 2MB)
                barang:
                  type: string
                  example: '[{"id_barang": 1, "jumlah": 10}]'
                  description: 'JSON array barang dari master | Format [{"id_barang": int, "jumlah": int}]'
                barang_lainnya:
                  type: string
                  example: '[{"nama": "Kabel HDMI", "jumlah": 5, "kategori": "habis_pakai", "satuan": "pcs", "alasan": "Kebutuhan laboratorium"}]'
                  description: |
                    JSON array barang manual | Format:
                    [{"nama": string, "jumlah": int, "kategori": "habis_pakai|tidak_habis_pakai", "satuan": string, "alasan": string}]
                bukti_foto_0:
                  type: string
                  format: binary
                  description: Bukti foto untuk barang_lainnya index 0 (jpg, png, jpeg - max 2MB)
                bukti_foto_1:
                  type: string
                  format: binary
                  description: Bukti foto untuk barang_lainnya index 1 (opsional)
      responses:
        201:
          description: Pengajuan berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DaftarPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        422:
          description: Validasi gagal atau periode pengajuan tidak aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/daftar-pengajuan/{id}:
    get:
      tags:
        - Pengajuan
      summary: Detail Pengajuan
      description: |
        Ambil detail pengajuan beserta:
        - List barang yang diajukan
        - Barang manual/lainnya
        - Status approval per barang
        
        **Proteksi akses:** User hanya bisa lihat pengajuan miliknya.
      operationId: getPengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Detail pengajuan berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DaftarPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          description: User tidak punya akses ke pengajuan ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Pengajuan
      summary: Update Pengajuan
      description: Update catatan/keterangan pengajuan. **User hanya bisa update pengajuan sendiri.**
      operationId: updatePengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catatan:
                  type: string
                  example: "Update perubahan kebutuhan barang"
      responses:
        200:
          description: Pengajuan berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DaftarPengajuan'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Pengajuan
      summary: Hapus Pengajuan
      description: Hapus pengajuan. **User hanya bisa hapus pengajuan sendiri yang belum di-approve.**
      operationId: deletePengajuan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Pengajuan berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
